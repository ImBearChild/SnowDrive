[package]
name = "snowscsi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SnowDrive iSCSI target CLI"

[[bin]]
name = "snowscsi"
path = "src/main.rs"

[dependencies]
snowdrive = { path = "../../snowdrive", default-features = false, features = [
    "std", "scsi", "iscsi", "iso9660", "cdrom",
] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
