[package]
name = "snow9660"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SnowDrive ISO9660 filesystem CLI"

[[bin]]
name = "snow9660"
path = "src/main.rs"

[dependencies]
snowdrive = { path = "../../snowdrive", default-features = false, features = ["std", "iso9660"] }
clap = { version = "4", features = ["derive"] }
