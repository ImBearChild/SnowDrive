[package]
name = "snowdrive-disc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SnowDrive disc: ISO9660/Joliet live-generation algorithms"

[features]
default = ["std"]
std = ["embedded-io/std", "snowdrive-common/std"]
iso9660 = []

[dependencies]
embedded-io = "0.7"
heapless = "0.8"
snowdrive-common = { path = "../snowdrive-common", default-features = false }
