[package]
name = "snowscsi-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for SnowDrive iSCSI target"

[[bin]]
name = "snowscsi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
snowscsi = { path = "../snowscsi", features = ["log"] }
