[package]
name = "snowscsi-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for SnowDrive iSCSI target"

[[bin]]
name = "snowscsi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
snowscsi = { path = "../snowscsi" }
