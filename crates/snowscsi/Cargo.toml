[package]
name = "snowscsi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SCSI device emulation + iSCSI target protocol (legacy shim; folded into snowdrive)"

[features]
default = ["std"]
std = ["embedded-io/std", "snowdrive/std", "snowdrive/scsi"]
log = ["snowcommon/log", "dep:log"]
defmt = ["snowcommon/defmt"]

[dependencies]
snowcommon = { path = "../snowcommon" }
snowdrive = { path = "../../snowdrive", default-features = false, features = ["scsi"] }
embedded-io = "0.7"
heapless = "0.8"
log = { version = "0.4", optional = true, default-features = false }
