[package]
name = "snowdrive-common"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SnowDrive common: storage seams + logging macros"

[features]
default = ["std"]
std = ["embedded-io/std"]
log = ["dep:log"]
defmt = ["dep:defmt"]

[dependencies]
embedded-io = "0.7"
heapless = "0.8"
log = { version = "0.4", optional = true, default-features = false }
defmt = { version = "1", optional = true }
